defaults:
  - SimToolRealStudySimpleRLBase
  - _self_

network:
  separate_value_mlp: False
  sigma_init: 0.0
  rnn: null
  mlp:
    units: [256, 128]
  transformer:
    memory_mode: segment
    block_type: transformer_xl
    context_length: 128
    n_layers: 6
    n_heads: 4
    n_kv_heads: 4
    ffn_hidden: 512
    dropout: 0.0
    actor_head_units: [128]
    critic_head_units: [128]

ppo:
  horizon_length: 128
  seq_length: 128
  learning_rate: 1e-4
