defaults:
  - SimToolRealLSTMAsymmetricPPO
  - _self_

params:
  network:
    space:
      continuous:
        fixed_sigma: coef_cond

  config:
    name: ${resolve_default:SimToolRealStudyRLGamesLSTMSAPG,${....experiment}}
    minibatch_size: 98304
    mini_epochs: 2
    use_others_experience: lf
    off_policy_ratio: 1.0
    expl_type: mixed_expl_learn_param
    # The generic train.py otherwise guesses this value from a legacy numeric
    # experiment-name prefix, which study run names intentionally do not use.
    expl_reward_coef: 1.0
    expl_reward_coef_embd_size: 32
    expl_reward_coef_scale: 0.005
    expl_reward_type: entropy
    expl_coef_block_size: 2048
    max_frames: 70000000000
    save_frequency: 1800
    central_value_config:
      minibatch_size: 98304
